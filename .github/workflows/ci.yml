name: CI

on:
  push:
    branches: [main, 'phase-*']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Type check, lint, unit tests, docs checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test:coverage
      - name: Traceability (SRD ids, plan, README chart)
        run: pnpm check:trace
      - name: Data dictionary is current (DOC-3)
        run: pnpm check:dictionary
      - name: JSON Schema export is current (D26, ARC-6)
        run: pnpm check:json-schema
      # The Python SDK (WP 6.1, Annex C PY-1): its generated models and fixtures are current and
      # its tests pass. Not in `pnpm check`, which must run on machines without Python.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: python/requirements-dev.txt
      - name: Python SDK models, fixtures and tests (PY-1 to PY-3)
        run: pnpm check:python
      - name: Blog posts' front matter, gate links and deny-list (DOC-24 to DOC-26)
        run: pnpm check:blog
      - name: Install Chromium for the Mermaid check
        run: pnpm exec playwright install --with-deps chromium
      - name: Mermaid blocks parse (DOC-22)
        run: pnpm check:mermaid

  build-e2e:
    name: Build and Playwright
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The Pyodide wheels the app's build ships (WP 6.2), fetched once and checked by sha256
      # against the lock: keyed on it, so only a Pyodide or package change downloads again.
      - name: Pyodide wheel cache
        uses: actions/cache@v4
        with:
          path: .cache/pyodide
          key: pyodide-${{ hashFiles('packages/py-runner/pyodide.lock.json') }}
      - run: pnpm build
      - name: Bundle has no external references (NFR-7, DOC-11)
        run: pnpm check:bundle
      - name: Site deny-list scan (DOC-2)
        run: node tools/site/check-deny-list.ts site/dist
      - name: Site has no secrets or real-server endpoints (NFR-1, DOC-12)
        run: node tools/site/check-site-bundle.ts site/dist
      - name: Site size (DOC-14)
        run: node tools/site/size-report.ts site/dist --title "Site build size"
      - run: pnpm --filter @wrx/web exec playwright install --with-deps chromium
      - name: App e2e in Chromium, with the performance guard (NFR-11, NFR-12) and axe (NFR-14)
        run: pnpm e2e
        env:
          CI: 'true'
      - name: Real-server build has no external references (NFR-7, DOC-11)
        run: node tools/check-bundle.ts apps/web/server-build/dist
      - name: Storybook builds (NFR-18)
        run: pnpm storybook:build
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
      - name: Mock host shared across tabs, isolated per deployment (D17, ARC-7, DOC-10, DOC-17, R7)
        run: pnpm e2e:mock-host
        env:
          CI: 'true'
      - name: Admin design editor in Chromium (ADM-3 to ADM-9, ADM-27, ADM-28)
        run: pnpm e2e:admin-ui
        env:
          CI: 'true'
      - name: Theme SVG sanitiser and bundled fonts in Chromium (WP 2.8, §3 rule 12, NFR-7)
        run: pnpm e2e:theme
        env:
          CI: 'true'
      - name: Site end to end, offline, under a nested base path (DOC-6, DOC-11, DOC-15)
        run: pnpm --filter @wrx/site e2e
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: site-playwright-report
          path: site/playwright-report
          retention-days: 7

  # NFR-13: the app's e2e suite in the other browsers, which only CI installs (locally there is
  # Chromium alone). Chrome and Edge are the SHALL (WP 0.4: the customer's analysts use them
  # only), covered by build-e2e's Chromium run. WebKit (for Safari) is a SHOULD, so it is
  # advisory: its test failures show as warnings and the job passes. Firefox is not supported
  # (product owner, Nov 3, 2026). Known failures are in plan/reviews/phase-3-browsers.md. The performance tests skip here: their timing APIs and
  # recorded numbers are Chromium's (build-e2e runs them).
  e2e-browsers:
    name: App e2e in ${{ matrix.browser }} (advisory)
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.advisory }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: webkit
            advisory: true
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The Pyodide wheels the app's build ships (WP 6.2), fetched once and checked by sha256
      # against the lock: keyed on it, so only a Pyodide or package change downloads again.
      - name: Pyodide wheel cache
        uses: actions/cache@v4
        with:
          path: .cache/pyodide
          key: pyodide-${{ hashFiles('packages/py-runner/pyodide.lock.json') }}
      - run: pnpm --filter @wrx/web exec playwright install --with-deps ${{ matrix.browser }}
      # Test failures here are warnings, not a red job (product owner, Nov 3, 2026): each failed
      # test becomes a warning annotation and a line in the job summary, and the job passes. A run
      # that fails without any failed test (install, build or server trouble) still fails.
      - id: e2e
        shell: bash
        run: |
          set +e
          pnpm e2e 2>&1 | tee e2e.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -eq 0 ]; then exit 0; fi
          failed=$(grep -E '^\s*✘' e2e.log | sed -E 's/^\s*✘\s*[0-9]+ //' | sort -u || true)
          if [ -z "$failed" ]; then
            echo "::error::The ${{ matrix.browser }} e2e run failed before any test failed (exit $status)."
            exit "$status"
          fi
          echo "failed=true" >> "$GITHUB_OUTPUT"
          {
            echo "### ${{ matrix.browser }}: $(echo "$failed" | wc -l) failed test(s), advisory"
            echo
            echo "$failed" | sed 's/^/- /'
          } >> "$GITHUB_STEP_SUMMARY"
          while IFS= read -r line; do
            echo "::warning title=${{ matrix.browser }} e2e (advisory)::$line"
          done <<< "$failed"
        env:
          CI: 'true'
          WRX_E2E_BROWSERS: ${{ matrix.browser }}
      - uses: actions/upload-artifact@v4
        if: failure() || steps.e2e.outputs.failed == 'true'
        with:
          name: playwright-report-${{ matrix.browser }}
          path: apps/web/playwright-report
          retention-days: 7

  # The ejabberd contract-suite job (NFR-16, NFR-22) joins this workflow in WP 1.2, when the
  # suite exists. It must fail, not skip, when the server is unavailable.
