# WP 0.3 reference ejabberd: the spike's stack (serge-web/xmpp-spike @ 4992530,
# spike/docker/ejabberd/compose.yaml + compose.tls.yaml) merged into one file, with host ports moved so it
# can run beside other stacks. Only wss:// is published (NFR-2, NFR-22). Start with `sh docker/up.sh`.
name: wrx-xmpplib
services:
  ejabberd:
    image: ejabberd/ecs:26.09@sha256:8ebff5b218e686d5dbd93850ea17556d5b70d4c15918c3613e9302a357798e0e
    ports:
      - "127.0.0.1:25443:5443" # HTTPS: /ws WebSocket over TLS
    volumes:
      - ./ejabberd.yml:/home/ejabberd/conf/ejabberd.yml:ro
      - ./bootstrap.sh:/home/ejabberd/bootstrap.sh:ro
      - ./tls-out/server.pem:/home/ejabberd/conf/server.pem:ro
      - ./tls-out/ca.crt:/home/ejabberd/conf/cacert.pem:ro
      - db:/home/ejabberd/database
    healthcheck:
      test: ["CMD", "ejabberdctl", "status"]
      interval: 3s
      timeout: 5s
      retries: 30
volumes:
  db:
