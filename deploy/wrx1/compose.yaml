# The WRX1 reference deployment (NFR-10, NFR-22): ejabberd 26.09 with the reference config
# (../ejabberd/ejabberd.yml, the same file the contract suite runs against), serving the built
# client and its WebSocket on one HTTPS origin: https://<host>/ and wss://<host>/ws.
#
# Installed by ops/offline-install.sh into WRX_HOME (default /opt/wrx1), next to wrx1.env, tls/
# and www/. Run it there with the ops scripts, which pass both env files:
#   docker compose --env-file wrx1.env --env-file image.env up -d --wait
# See ops/README.md.
name: wrx1
services:
  ejabberd:
    # ejabberd 26.09, the official image, pinned by digest (NFR-22). The install loads it from the
    # bundle, checks its layers against the bundle's MANIFEST, and names it in image.env; the
    # default here is for a connected machine.
    image: ${WRX_EJABBERD_IMAGE:-ejabberd/ecs:26.09@sha256:8ebff5b218e686d5dbd93850ea17556d5b70d4c15918c3613e9302a357798e0e}
    # Air-gapped: never reach for a registry. The image must already be loaded.
    pull_policy: never
    restart: unless-stopped
    environment:
      # The XMPP domain (ejabberd.yml's HOST macro).
      EJABBERD_MACRO_HOST: ${WRX_DOMAIN:?set WRX_DOMAIN in wrx1.env}
    ports:
      # The only published port: HTTPS and wss:// (NFR-2). Nothing else listens outside the
      # container.
      - '${WRX_BIND_ADDRESS:-0.0.0.0}:${WRX_HTTPS_PORT:-443}:5443'
    volumes:
      - ./ejabberd.yml:/home/ejabberd/conf/ejabberd.yml:ro
      # Server certificate and key in one PEM, and the issuing CA's certificate (NFR-2).
      - ./tls/server.pem:/home/ejabberd/conf/server.pem:ro
      - ./tls/ca.crt:/home/ejabberd/conf/cacert.pem:ro
      # The built client (apps/web server build) with this deployment's config.json.
      - ./www:/home/ejabberd/www:ro
      # Accounts, rooms, archives, nodes and their items (theme assets included): what
      # ops/backup.sh saves.
      - database:/home/ejabberd/database
      - logs:/home/ejabberd/logs
    healthcheck:
      test: ['CMD', 'ejabberdctl', 'status']
      interval: 5s
      timeout: 5s
      retries: 30
    # Hardening that costs nothing: ejabberd runs as its own user (uid 9000) on a port above
    # 1024, so it needs no Linux capability and no privilege escalation. (A read-only root file
    # system does not work: Erlang writes its cookie into the image's home directory.)
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
volumes:
  database:
  logs:
